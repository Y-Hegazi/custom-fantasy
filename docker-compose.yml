services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: custom-fantasy-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - FOOTBALL_DATA_ORG_KEY=${FOOTBALL_DATA_ORG_KEY}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
